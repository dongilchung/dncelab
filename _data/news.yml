- date: 2026-09-02
  title: "New website"
  content: |
    We are currently transitioning to a new lab website, and the site is still under construction.

    From now on, our main website will be: [https://dongilchung.github.io/dncelab/] (https://dongilchung.github.io/dncelab/)

    We are continuing to update and migrate content, so some pages and features may change during the transition. Please visit the new website for the latest information about our lab, research, people, publications, and news.
- date: 2026-08-14
  title: "Joining Seoul National University"
  content: |
    Starting this September, I will be joining the Department of Brain Cognitive Sciences and SNU College at Seoul National University as an Associate Professor.

    After many rewarding years at UNIST, I am excited to begin this new chapter at SNU. I am deeply grateful to UNIST for the support, opportunities, and wonderful colleagues who have made my time here such a meaningful part of my academic journey. I am especially thankful to the students, colleagues, and collaborators who have shared in the growth of our research and lab.

    While it is bittersweet to leave UNIST, I look forward to new opportunities to expand our research and collaborations at SNU.
- date: 2022-07-07
  title: "EEG Workshop Day"
  content: |
    We arranged an EEG workshop day covering the basics of EEG through analysis. We also invited Dr. Seongkyun Kim, CEO of 4N Inc., as a speaker to share his story about founding a startup company based on his research expertise.
- date: 2022-01-26
  title: "WE CAN DO IT project launching"
  content: |
    Our lab at UNIST started a collaborative study with labs at SNU and SNU Hospital to understand neurodevelopmental changes in adolescents. The project is called WE CAN DO IT (Wellness Effects on Childhood and Adolescent Neurocognitive Development Outcomes and Individual Trajectories).

    [Project website](https://sites.google.com/view/wecandoit2022/)
